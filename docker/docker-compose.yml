services:
  postgres:
    image: postgres:16-alpine
    container_name: hunter-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hunter}
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, copy .env.example to .env}
    ports:
      - "5433:5432"
    volumes:
      - hunter_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hunter} -d ${POSTGRES_DB:-hunter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hunter-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__HunterDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hunter};Username=${POSTGRES_USER:-hunter};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required, copy .env.example to .env}
      Webhooks__InboundSecret: ${WEBHOOKS_INBOUND_SECRET:-}
      WhatsAppCloudApi__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WhatsAppCloudApi__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}
      # WhatsApp Business Account ID (distinto del PhoneNumberId): solo se usa para traer de la
      # Graph API el texto real aprobado de TemplateName y loguear eso en Message.Content en vez
      # del texto libre local. Sin esto, el envío funciona igual.
      WhatsAppCloudApi__WabaId: ${WHATSAPP_WABA_ID:-}
      WhatsAppCloudApi__AppSecret: ${WHATSAPP_APP_SECRET:-}
      WhatsAppCloudApi__WebhookVerifyToken: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WhatsAppCloudApi__TemplateName: ${WHATSAPP_TEMPLATE_NAME:-}
      WhatsAppCloudApi__TemplateLanguage: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WhatsAppCloudApi__TemplateBodyParameterCount: ${WHATSAPP_TEMPLATE_BODY_PARAMETER_COUNT:-1}
      WhatsAppCloudApi__TemplateSecondParameter: ${WHATSAPP_TEMPLATE_SECOND_PARAMETER:-}
      # Botón quick_reply de TemplateName ("Estoy interesado"). No se define acá con :N indexado
      # porque un valor vacío por defecto crearía un elemento "" en la lista (rompe BuildPayload:
      # agregaría un botón con payload vacío). Setear editando este archivo, o vía las variables
      # de entorno de la plataforma de deploy, recién cuando la plantilla con el botón esté
      # aprobada en Meta.
      # WhatsAppCloudApi__TemplateQuickReplyPayloads__0: ESTOY_INTERESADO
      WhatsAppCloudApi__HandoffTemplateName: ${WHATSAPP_HANDOFF_TEMPLATE_NAME:-}
      WhatsAppCloudApi__HandoffTemplateLanguage: ${WHATSAPP_HANDOFF_TEMPLATE_LANGUAGE:-es}
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      # Habilita el envío automático de campañas Running (batch cada PollIntervalSeconds,
      # tamaño de lote = Campaign.MessagesPerMinute). false = solo se envía a mano vía
      # POST /campaigns/{id}/process-queue, como hasta ahora.
      CampaignQueue__Enabled: ${CAMPAIGN_QUEUE_ENABLED:-false}
      CampaignQueue__PollIntervalSeconds: ${CAMPAIGN_QUEUE_POLL_INTERVAL_SECONDS:-60}
      OpenStreetMap__Endpoint: ${OSM_OVERPASS_ENDPOINT:-https://overpass-api.de/api/interpreter}
      OpenStreetMap__UserAgent: ${OSM_USER_AGENT:-HunterCRM/1.0}
      Nominatim__Endpoint: ${NOMINATIM_ENDPOINT:-https://nominatim.openstreetmap.org/search}
      Nominatim__UserAgent: ${NOMINATIM_USER_AGENT:-HunterCRM/1.0}
      # Fuente alternativa a OpenStreetMap para "Buscar prospectos" (rubro libre vía Google Maps
      # Scraper de Apify, sin el mapeo cerrado a 5 rubros que tiene OSM). Sin token, el selector
      # de fuente sigue mostrándose pero la búsqueda falla con el error de Apify.
      Apify__ApiToken: ${APIFY_API_TOKEN:-}
      Apify__ActorId: ${APIFY_ACTOR_ID:-compass~crawler-google-places}
      # Sin esto, las alertas de lead nuevo caen a StubTelegramNotifier (solo loguea, no manda
      # nada real). Token/username dados por @BotFather. WebhookSecret es el secret_token que se
      # configura al registrar el webhook (setWebhook) — ver instrucciones de deploy.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hunter_postgres_data:
